services:
  - type: web
    name: my-render-api-test
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: my-render-api-test-db
          property: connectionString

databases:
  - name: my-render-api-test-db
    plan: free
